name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Integration tests (*IT) start LocalStack through Testcontainers on the runner's Docker
      # daemon. Set AWS_ENDPOINT_OVERRIDE to run them against an already running emulator instead.
      - name: Build, unit tests and integration tests
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore

  console:
    name: Console lint, types, tests and both builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: taskforge-dashboard
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskforge-dashboard/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # The service edition, as the Maven build packages it, and the browser edition the hosted page runs.
      - run: npx vite build
      - run: VITE_DEMO=1 npx vite build

  images:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build API and worker images
        run: docker compose build
