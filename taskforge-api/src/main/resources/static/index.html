<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskForge — Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <style>
        /**
         * TaskForge Dashboard Styles
         * Design tokens from roycarlous.com portfolio:
         *   Background: #08080c
         *   Accent: #DC2626 -> #EA580C -> #F59E0B -> #1D4ED8
         *   Surface: rgba(255,255,255,0.02)
         *   Border: rgba(255,255,255,0.06)
         *   Font: SF Pro / system
         */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #08080c;
            --surface: rgba(255,255,255,0.02);
            --surface-hover: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(220,38,38,0.15);
            --red: #DC2626;
            --orange: #EA580C;
            --amber: #F59E0B;
            --blue: #1D4ED8;
            --green: #22c55e;
            --text: #e4e4e7;
            --text-secondary: #9ca3af;
            --text-muted: #4b5563;
            --gradient: linear-gradient(135deg, #DC2626 0%, #EA580C 35%, #F59E0B 60%, #1D4ED8 100%);
        }

        body {
            font-family: 'SF Pro Display', 'SF Pro Text', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Noise overlay */
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        ::selection { background: rgba(220,38,38,0.2); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(220,38,38,0.25); border-radius: 4px; }

        .app { position: relative; z-index: 1; }

        /* Nav */
        .nav {
            position: sticky; top: 0; z-index: 100;
            height: 64px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px;
            background: rgba(8,8,12,0.85); backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
        }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-mark {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #DC2626, #EA580C);
            color: #fff; font-size: 11px; font-weight: 700;
        }
        .logo-text { font-weight: 600; font-size: 17px; letter-spacing: -0.02em; }
        .gradient-text {
            background: var(--gradient); -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; background-clip: text;
        }
        .nav-status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
        .pulse-dot {
            width: 6px; height: 6px; border-radius: 50%; background: var(--green);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,197,94,0.3); }
            50% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(34,197,94,0); }
        }

        /* Layout */
        .main { max-width: 1100px; margin: 0 auto; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; }

        /* Cards */
        .card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .card:hover { border-color: var(--border-hover); box-shadow: 0 0 50px rgba(220,38,38,0.03); }
        .card-header {
            padding: 16px 24px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .card-title {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 11px; font-weight: 500; letter-spacing: 0.12em;
            text-transform: uppercase; color: var(--red);
        }
        .card-body { padding: 24px; }

        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        @media (max-width: 700px) { .stats { grid-template-columns: repeat(2, 1fr); } }
        .stat {
            background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
            padding: 18px 20px; transition: border-color 0.3s;
        }
        .stat:hover { border-color: var(--border-hover); }
        .stat-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
        .stat-value { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }

        /* Content grid */
        .content-grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; }
        @media (max-width: 900px) { .content-grid { grid-template-columns: 1fr; } }

        /* Form */
        .form-group { margin-bottom: 14px; }
        .form-label {
            display: block; font-size: 10px; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px;
            font-family: 'SF Mono', monospace;
        }
        .form-select, .form-textarea {
            width: 100%; background: var(--bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 10px 14px; color: var(--text);
            font-family: 'SF Mono', monospace; font-size: 13px; outline: none;
            transition: border-color 0.2s;
        }
        .form-select:focus, .form-textarea:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(220,38,38,0.06); }
        .form-select option { background: var(--bg); }
        .form-textarea { resize: vertical; min-height: 72px; }

        /* Buttons */
        .btn {
            padding: 10px 20px; border-radius: 9999px; font-size: 13px;
            font-weight: 600; cursor: pointer; border: none; transition: all 0.15s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #DC2626, #EA580C);
            color: #fff; width: 100%;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(220,38,38,0.2); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-sm { padding: 4px 12px; font-size: 11px; border-radius: 9999px; }
        .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-ghost:hover { color: var(--text); border-color: var(--border-hover); }
        .btn-danger { background: transparent; color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
        .btn-danger:hover { background: rgba(239,68,68,0.08); }

        /* Table */
        .table { width: 100%; border-collapse: collapse; }
        .table th {
            text-align: left; padding: 10px 20px;
            font-family: 'SF Mono', monospace; font-size: 10px;
            text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--text-muted); border-bottom: 1px solid var(--border);
        }
        .table td { padding: 12px 20px; font-size: 13px; border-bottom: 1px solid var(--border); }
        .table tr:hover td { background: var(--surface-hover); }
        .table tr:last-child td { border-bottom: none; }

        /* Status badge */
        .badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 10px; border-radius: 9999px;
            font-family: 'SF Mono', monospace; font-size: 10px; font-weight: 600;
        }
        .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; }
        .badge-ACCEPTED { background: rgba(59,130,246,0.08); color: #60a5fa; }
        .badge-ACCEPTED::before { background: #60a5fa; }
        .badge-QUEUED { background: rgba(168,85,247,0.08); color: #c084fc; }
        .badge-QUEUED::before { background: #c084fc; }
        .badge-PROCESSING { background: rgba(245,158,11,0.08); color: #F59E0B; }
        .badge-PROCESSING::before { background: #F59E0B; animation: pulse 1s infinite; }
        .badge-COMPLETED { background: rgba(34,197,94,0.08); color: #22c55e; }
        .badge-COMPLETED::before { background: #22c55e; }
        .badge-FAILED { background: rgba(239,68,68,0.08); color: #ef4444; }
        .badge-FAILED::before { background: #ef4444; }
        .badge-DEAD_LETTER { background: rgba(239,68,68,0.12); color: #f87171; }
        .badge-DEAD_LETTER::before { background: #f87171; }

        /* Type badge */
        .type-badge {
            font-family: 'SF Mono', monospace; font-size: 10px; font-weight: 600;
            padding: 3px 8px; border-radius: 6px;
        }
        .type-SALES_SUMMARY { background: rgba(220,38,38,0.08); color: #DC2626; }
        .type-INVENTORY_SNAPSHOT { background: rgba(245,158,11,0.08); color: #F59E0B; }
        .type-USER_ACTIVITY { background: rgba(29,78,216,0.08); color: #60a5fa; }

        /* Misc */
        .mono { font-family: 'SF Mono', 'Fira Code', monospace; }
        .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
        .empty { padding: 48px 20px; text-align: center; color: var(--text-muted); }

        /* Toast */
        .toast {
            position: fixed; bottom: 24px; right: 24px; z-index: 200;
            background: var(--surface); border: 1px solid var(--border);
            border-left: 3px solid var(--green); border-radius: 16px;
            padding: 14px 20px; font-size: 13px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            animation: slideIn 0.3s ease;
        }
        .toast.error { border-left-color: #ef4444; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Fade in */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeUp 0.4s ease both; }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;
    const API = '/api/v1';

    /**
     * API helper functions for report lifecycle operations.
     */
    const api = {
        getReports: (status) => {
            const url = status ? `${API}/reports?status=${status}` : `${API}/reports`;
            return fetch(url).then(r => r.json());
        },
        getReport: (id) => fetch(`${API}/reports/${id}`).then(r => r.json()),
        getHealth: () => fetch(`${API}/health`).then(r => r.json()).catch(() => null),
        submit: (data) => fetch(`${API}/reports`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
        }).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }),
    };

    /** Toast notification. */
    function Toast({ message, type, onClose }) {
        useEffect(() => { const t = setTimeout(onClose, 3500); return () => clearTimeout(t); }, []);
        return <div className={`toast ${type || ''}`}>{message}</div>;
    }

    /** Stat card for the top row. */
    function Stat({ label, value, color }) {
        return (
            <div className="stat">
                <div className="stat-label">{label}</div>
                <div className="stat-value" style={{ color: color || 'var(--text)' }}>{value}</div>
            </div>
        );
    }

    /**
     * Report submission form.
     * Pre-fills payload JSON based on selected report type.
     */
    function SubmitForm({ onSubmit }) {
        const [type, setType] = useState('SALES_SUMMARY');
        const [params, setParams] = useState('{"dateFrom":"2025-12-01","dateTo":"2026-02-28","region":"North"}');
        const [submitting, setSubmitting] = useState(false);

        const presets = {
            SALES_SUMMARY: '{"dateFrom":"2025-12-01","dateTo":"2026-02-28","region":"North"}',
            INVENTORY_SNAPSHOT: '{"lowStockThreshold":"15"}',
            USER_ACTIVITY: '{"dateFrom":"2026-02-01","dateTo":"2026-02-28"}',
        };

        const handleType = (t) => { setType(t); setParams(presets[t]); };

        const handleSubmit = async () => {
            setSubmitting(true);
            try {
                const parsed = JSON.parse(params);
                await onSubmit({ type, parameters: parsed });
            } catch (e) {
                onSubmit(null, e.message);
            } finally {
                setSubmitting(false);
            }
        };

        return (
            <div>
                <div className="form-group">
                    <label className="form-label">Report Type</label>
                    <select className="form-select" value={type} onChange={e => handleType(e.target.value)}>
                        <option value="SALES_SUMMARY">SALES_SUMMARY</option>
                        <option value="INVENTORY_SNAPSHOT">INVENTORY_SNAPSHOT</option>
                        <option value="USER_ACTIVITY">USER_ACTIVITY</option>
                    </select>
                </div>
                <div className="form-group">
                    <label className="form-label">Parameters (JSON)</label>
                    <textarea className="form-textarea" value={params} onChange={e => setParams(e.target.value)} spellCheck="false" />
                </div>
                <button className="btn btn-primary" onClick={handleSubmit} disabled={submitting}>
                    {submitting ? 'Submitting...' : '⚡ Generate Report'}
                </button>
            </div>
        );
    }

    /**
     * Main application.
     * Polls /reports every 2s to reflect real-time status changes.
     */
    function App() {
        const [reports, setReports] = useState([]);
        const [health, setHealth] = useState(null);
        const [filter, setFilter] = useState('ALL');
        const [toast, setToast] = useState(null);

        const showToast = (message, type) => setToast({ message, type, key: Date.now() });

        const refresh = useCallback(async () => {
            try {
                const [reps, hlth] = await Promise.all([api.getReports(), api.getHealth()]);
                setReports(reps);
                setHealth(hlth);
            } catch (e) { /* silent */ }
        }, []);

        useEffect(() => {
            refresh();
            const interval = setInterval(refresh, 2000);
            return () => clearInterval(interval);
        }, [refresh]);

        const handleSubmit = async (data, error) => {
            if (error) { showToast('Invalid JSON: ' + error, 'error'); return; }
            try {
                const r = await api.submit(data);
                showToast(`Report submitted: ${r.correlationId}`);
                refresh();
            } catch (e) { showToast('Failed: ' + e.message, 'error'); }
        };

        /* Stats */
        const total = reports.length;
        const completed = reports.filter(r => r.status === 'COMPLETED').length;
        const failed = reports.filter(r => r.status === 'FAILED' || r.status === 'DEAD_LETTER').length;
        const pending = reports.filter(r => ['ACCEPTED', 'QUEUED', 'PROCESSING'].includes(r.status)).length;

        /* Filter */
        const filtered = filter === 'ALL' ? reports : reports.filter(r => r.status === filter);
        const sorted = [...filtered].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        const formatTime = (ts) => {
            if (!ts) return '—';
            return new Date(ts).toLocaleTimeString('en-US', { hour12: false });
        };

        return (
            <div className="app">
                {/* Nav */}
                <nav className="nav">
                    <div className="logo">
                        <div className="logo-mark">T</div>
                        <div className="logo-text">Task<span className="gradient-text">Forge</span></div>
                    </div>
                    <div className="nav-status">
                        <div className="pulse-dot"></div>
                        <span className="mono" style={{fontSize: 11}}>Live · Queue: {health?.queueDepth ?? '—'}</span>
                    </div>
                </nav>

                <main className="main">
                    {/* Stats */}
                    <div className="stats fade-in">
                        <Stat label="Total Reports" value={total} />
                        <Stat label="Completed" value={completed} color="var(--green)" />
                        <Stat label="Failed / Dead-letter" value={failed} color="#ef4444" />
                        <Stat label="In Progress" value={pending} color="var(--amber)" />
                    </div>

                    {/* Content */}
                    <div className="content-grid">
                        {/* Left: Submit + Info */}
                        <div style={{display: 'flex', flexDirection: 'column', gap: 16}}>
                            <div className="card fade-in">
                                <div className="card-header">
                                    <div className="card-title">Generate Report</div>
                                </div>
                                <div className="card-body">
                                    <SubmitForm onSubmit={handleSubmit} />
                                </div>
                            </div>
                            <div className="card fade-in">
                                <div className="card-header">
                                    <div className="card-title">Service Health</div>
                                </div>
                                <div className="card-body" style={{fontSize: 12, color: 'var(--text-secondary)'}}>
                                    <div className="mono" style={{display: 'flex', flexDirection: 'column', gap: 6}}>
                                        <div>status: <span style={{color: 'var(--green)'}}>UP</span></div>
                                        <div>queue: <span style={{color: 'var(--text)'}}>{health?.queueDepth ?? '—'}</span> messages</div>
                                        <div>service: <span style={{color: 'var(--text)'}}>{health?.service ?? '—'}</span></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Right: Reports table */}
                        <div className="card fade-in">
                            <div className="card-header">
                                <div className="card-title">Reports ({sorted.length})</div>
                                <button className="btn btn-sm btn-ghost" onClick={refresh}>Refresh</button>
                            </div>
                            {/* Filters */}
                            <div style={{padding: '10px 20px', borderBottom: '1px solid var(--border)', display: 'flex', gap: 6, flexWrap: 'wrap'}}>
                                {['ALL', 'COMPLETED', 'PROCESSING', 'QUEUED', 'FAILED', 'DEAD_LETTER'].map(f => (
                                    <button key={f} className="btn btn-sm btn-ghost" onClick={() => setFilter(f)}
                                        style={filter === f ? {background: 'rgba(220,38,38,0.08)', borderColor: 'rgba(220,38,38,0.2)', color: '#DC2626'} : {}}>
                                        {f}
                                    </button>
                                ))}
                            </div>
                            {sorted.length === 0 ? (
                                <div className="empty">No reports yet. Submit one from the left panel.</div>
                            ) : (
                                <div style={{overflowX: 'auto'}}>
                                    <table className="table">
                                        <thead>
                                            <tr>
                                                <th>Correlation</th>
                                                <th>Type</th>
                                                <th>Status</th>
                                                <th>Time</th>
                                                <th>Duration</th>
                                                <th>Download</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {sorted.map(r => (
                                                <tr key={r.id}>
                                                    <td><span className="mono" style={{fontSize: 11, color: 'var(--orange)'}}>{r.correlationId}</span></td>
                                                    <td><span className={`type-badge type-${r.type}`}>{r.type}</span></td>
                                                    <td><span className={`badge badge-${r.status}`}>{r.status}</span></td>
                                                    <td><span className="mono" style={{fontSize: 11, color: 'var(--text-muted)'}}>{formatTime(r.createdAt)}</span></td>
                                                    <td><span className="mono" style={{fontSize: 11, color: 'var(--text-muted)'}}>{r.executionTimeMs > 0 ? r.executionTimeMs + 'ms' : '—'}</span></td>
                                                    <td>
                                                        {r.status === 'COMPLETED' && r.downloadUrl ? (
                                                            <a href={r.downloadUrl} target="_blank" rel="noopener noreferrer"
                                                                className="btn btn-sm btn-ghost" style={{textDecoration: 'none', color: 'var(--green)'}}>
                                                                CSV ↓
                                                            </a>
                                                        ) : r.errorMessage ? (
                                                            <span className="mono" style={{fontSize: 10, color: '#ef4444'}} title={r.errorMessage}>Error</span>
                                                        ) : (
                                                            <span style={{color: 'var(--text-muted)'}}>—</span>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    </div>
                </main>

                {/* Footer */}
                <footer style={{borderTop: '1px solid var(--border)', padding: '20px 24px', marginTop: 40}}>
                    <div style={{maxWidth: 1100, margin: '0 auto', display: 'flex', justifyContent: 'space-between', fontSize: 11, color: 'var(--text-muted)'}}>
                        <span>TaskForge · Distributed Report Generation Engine</span>
                        <a href="https://roycarlous.com" target="_blank" rel="noopener noreferrer" style={{color: 'var(--text-muted)', textDecoration: 'none'}}>Roy Carlous</a>
                    </div>
                </footer>

                {toast && <Toast key={toast.key} message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
